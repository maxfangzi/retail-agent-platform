name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Olist dataset & seed SQLite
        run: |
          python scripts/download_data.py
          python scripts/seed_db.py

      - name: Unit tests (pytest)
        run: python -m pytest tests/ -q

      - name: RAG retrieval eval (18 cases, offline)
        run: python scripts/run_evals.py --retrieval-only

      - name: MCP server smoke test
        run: python scripts/smoke_mcp.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (syntax + unused imports)
        run: |
          pip install ruff
          ruff check app scripts tests --select F,E9
